[package]
name = "iscc-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false               # Published via npm, not crates.io

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iscc-lib = { path = "../iscc-lib" }
# Direct blake3 dep solely to enable the wasm32_simd Cargo feature (feature-unifies
# onto iscc-lib's blake3 for the wasm-only build). Do not remove as "unused".
blake3 = { workspace = true, features = ["wasm32_simd"] }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[features]
conformance = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-simd",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
]
