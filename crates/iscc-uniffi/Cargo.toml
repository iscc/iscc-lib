[package]
name = "iscc-uniffi"
version.workspace = true
edition.workspace = true
# This crate's own dependency graph sets its rustc floor: uniffi -> cargo_metadata ->
# cargo-platform 0.3.3 requires rustc 1.91. The crate is `publish = false`, so the
# published iscc-lib MSRV stays at the workspace's rust-version = "1.85".
rust-version = "1.91"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "UniFFI scaffolding for iscc-lib (Swift and Kotlin bindings)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
iscc-lib = { path = "../iscc-lib", features = ["meta-code"] }
uniffi = { workspace = true }
thiserror = { workspace = true }
