[workspace]
resolver = "2"
members = [
  "crates/iscc-lib",
  "crates/iscc-py",
  "crates/iscc-napi",
  "crates/iscc-wasm",
  "crates/iscc-ffi",
  "crates/iscc-jni",
  "crates/iscc-rb",
  "crates/iscc-uniffi",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Titusz Pan <tp@py7.de>"]
license = "Apache-2.0"
repository = "https://github.com/iscc/iscc-lib"
homepage = "https://lib.iscc.codes"
description = "High-performance Rust implementation of ISO 24138:2024 (ISCC)"

[workspace.dependencies]
blake3 = "1"
data-encoding = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
thiserror = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
# note: pyo3 bumps must re-verify `gil_used = true` (crates/iscc-py/src/lib.rs) and the
# `py.detach` call sites (issue #41).
pyo3 = { version = "0.29", features = ["abi3-py310"] }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
napi-build = "2"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
serde-wasm-bindgen = "0.6"
# held: criterion 0.8 requires rustc 1.86; the workspace declares rust-version = "1.85".
# Revisit when the MSRV is raised (a human policy decision for the v1.0.0 cut).
criterion = { version = "0.7", features = ["html_reports"] }
iai-callgrind = "0.16"
tempfile = "3"
# held: jni 0.22 is a wholesale API rework (JNIEnv -> EnvUnowned/Env, GlobalRef -> Global,
# AutoLocal -> Auto, closure-based thread attachment, mandatory ErrorPolicy) that rewrites
# crates/iscc-jni/src/lib.rs per upstream docs/0.22-MIGRATION.md. Needs a dedicated step.
jni = "0.21"
# held: magnus 0.8 drops the default `old-api` feature, which deprecates
# `magnus::exception::runtime_error()` used in crates/iscc-rb/src/lib.rs (a clippy -D warnings
# failure); needs a call-site refactor to `Ruby::exception_runtime_error()`. Deferred to the
# Ruby dependency slice (where the rb_sys gem must keep matching the cross-gem Docker tag).
magnus = { version = "0.7", features = ["rb-sys"] }
# held: uniffi 0.32 requires regenerating and re-verifying the Swift + Kotlin bindings; the
# Linux devcontainer has no Swift toolchain, so the result cannot be validated locally.
uniffi = "0.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The bench profile inherits from release but MUST keep its symbols and debug
# info: iai-callgrind toggles instruction collection on the
# `__iai_callgrind_wrapper_mod::*` symbols, so a stripped bench binary matches
# nothing and every benchmark reports zero collected instructions. `strip =
# false` preserves those toggle symbols; `debug = true` gives callgrind line
# info for `--dump-line=yes`.
[profile.bench]
strip = false
debug = true
