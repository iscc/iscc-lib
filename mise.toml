# mise.toml — task runner and tool versions for iscc-lib
#
# Usage: mise run <task>

# --- CID (Continuous Iterative Development) ---

[tasks."cid:run"]
description = "Run CID loop until done or max iterations (default: 20)"
usage = '''
arg "<n>" help="Max iterations" default="20"
arg "<pause>" help="Pause in seconds between iterations" default="1200"
'''
run = 'uv run tools/cid.py --skip-permissions --fallback-model opus run --max-iterations "${usage_n}" --pause "${usage_pause}"'

[tasks."cid:step"]
description = "Run one full CID iteration (update-state → define-next → advance → review)"
run = "uv run tools/cid.py --skip-permissions step"

[tasks."cid:status"]
description = "Show current project state from state.md"
run = "uv run tools/cid.py status"

[tasks."cid:stats"]
description = "Show iteration log summary statistics"
run = "uv run tools/cid.py stats"

[tasks."cid:improve"]
description = "Run the meta-improve self-improvement role once"
run = "uv run tools/cid.py --skip-permissions improve"

[tasks."cid:audit"]
description = "Run the codebase audit role once (metrics snapshot + maintainability audit)"
run = "uv run tools/cid.py --skip-permissions audit"

[tasks."cid:metrics"]
description = "Append a codebase-health snapshot to .claude/context/metrics.jsonl"
run = "uv run tools/metrics.py"

[tasks."cid:state"]
description = "Run update-state agent only"
run = "uv run tools/cid.py --skip-permissions role update-state"

[tasks."cid:next"]
description = "Run define-next agent only"
run = "uv run tools/cid.py --skip-permissions role define-next"

[tasks."cid:advance"]
description = "Run advance agent only"
run = "uv run tools/cid.py --skip-permissions role advance"

[tasks."cid:review"]
description = "Run review agent only"
run = "uv run tools/cid.py --skip-permissions role review"

# --- PR ---

[tasks."pr:main"]
description = "Create a PR from develop to main"
usage = '''
arg "<title>" help="PR title" default="Merge develop into main"
arg "<body>" help="PR body" default="Merge CID loop progress from develop into main."
'''
run = 'gh pr create -B main -H develop --title "${usage_title}" --body "${usage_body}"'

# --- Quality ---

[tasks.check]
description = "Run all pre-commit hooks on all files"
run = "uv run prek run --all-files"

[tasks.lint]
description = "Run format checks, clippy, and ruff"
run = """
cargo fmt --all --check &&
cargo clippy --workspace --all-targets -- -D warnings &&
uv run ruff check &&
uv run ruff format --check
"""

[tasks.format]
description = "Run pre-commit auto-fix hooks (quiet, filtered output)"
run = "uv run prek run --stage pre-commit --all-files -q 2>&1 || true"

[tasks.test]
description = "Run all tests"
run = """
cargo test --workspace &&
uv run pytest
"""

# --- Release verification ---

[tasks."test:install"]
description = "Test published packages are installable from registries"
usage = '''
arg "[flags]" var=#true help="Flags forwarded to test_install.py (default: --version 0.5.0)"
'''
run = 'uv run scripts/test_install.py ${usage_flags:---version 0.5.0}'

# --- Version ---

[tasks."version:sync"]
description = "Sync non-Cargo manifest versions with workspace version"
run = "uv run scripts/version_sync.py"

[tasks."version:check"]
description = "Check that all manifest versions match workspace version"
run = "uv run scripts/version_sync.py --check"

# --- API stability ---

[tasks.semver]
description = "Check iscc-lib public API for SemVer violations vs the last published release"
run = "cargo semver-checks check-release -p iscc-lib"

# --- Coverage ---

[tasks.coverage]
description = "Generate an LCOV coverage report for iscc-lib (cargo llvm-cov)"
run = "cargo llvm-cov -p iscc-lib --lcov --output-path lcov.info"

[tasks.crap]
description = "Report per-function CRAP scores for iscc-lib (cargo crap, report-only)"
depends = ["coverage"]
run = "cargo crap --lcov lcov.info"

[tasks."crap:baseline"]
description = "Regenerate the committed CRAP regression baseline (.crap-baseline.json)"
depends = ["coverage"]
run = "cargo crap --lcov lcov.info --format json --output .crap-baseline.json"

# --- Performance ---

[tasks."bench:iai"]
description = "Run iai-callgrind instruction-count benches for iscc-lib (needs valgrind)"
# IAI_CALLGRIND_ALLOW_ASLR makes iai-callgrind skip its `setarch -R` ASLR-disable
# step, which the devcontainer kernel blocks (the `personality` syscall is denied,
# so `setarch` fails with "Operation not permitted"). ASLR does not affect
# instruction counts (Ir) — only cache-sim noise — so this is safe for the gate.
env = { IAI_CALLGRIND_ALLOW_ASLR = "true" }
run = "cargo bench -p iscc-lib --bench iai_benches"

[tasks."bench:iai:check"]
description = "Check the local iai-callgrind run against the committed .iai-baseline.json"
depends = ["bench:iai"]
run = "python3 scripts/iai_regression.py --check"

[tasks."bench:iai:baseline"]
description = "Regenerate the committed iai-callgrind regression baseline (.iai-baseline.json)"
# Prefer refreshing from a CI artifact (see scripts/iai_regression.py docstring) so the
# baseline matches the rustc the CI gate measures with; this local refresh is a fallback.
depends = ["bench:iai"]
run = "python3 scripts/iai_regression.py --update"

# --- Unicode conformance ---

[tasks."unicode:sweep"]
description = "Differential sweep of text_clean/text_collapse against iscc-core on Unicode 16.0.0"
# Rebuilds the Python extension first: the sweep measures whatever `.so` is installed,
# and a stale one silently measures the previous commit.
run = """
uv run maturin develop --release --manifest-path crates/iscc-py/Cargo.toml &&
uv run scripts/unicode_sweep.py --rebuilt
"""

# --- Supply-chain audit ---

[tasks.audit]
description = "Run the cargo-deny supply-chain gate (advisories + licenses + bans + sources)"
# Reproduces the enforcing `Audit (cargo-deny)` CI job locally. Requires cargo-deny
# (install via `cargo binstall cargo-deny` or `cargo install cargo-deny --locked`).
run = "cargo deny check"
