[project]
name = "iscc-lib"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ty.src]
# Exclude Conan recipe — conan is not a project dependency.
# Exclude the Unicode table generator — unicodedata2 is a PEP 723 generator-only
# dependency (run via `uv run --script`), not a project dependency.
exclude = ["packages/cpp/conanfile.py", "scripts/gen_unicode16_unassigned.py"]

[tool.ruff]
# `iscc_lib` ships from `crates/iscc-py/python`, not the repo root. Listing it here makes isort
# resolve it as first-party instead of lumping it in with third-party imports.
src = [".", "crates/iscc-py/python"]

[tool.ruff.lint]
# `S` (security) and `C901` (complexity) are project gates. Selecting them here — instead of
# only in the two pre-push hooks — makes `uv run ruff check` (pre-commit, `mise run lint`, CI)
# enforce them too, and keeps the load-bearing `# noqa: S603/S607` directives recognised.
# `I` (import sorting), `RUF022` (sorted `__all__`) and `RUF100` (unused `# noqa`) are enforced
# here under the pinned ruff so the 0.16 defaults arrive without surprise findings.
extend-select = ["S", "C901", "I", "RUF022", "RUF100"]

[tool.ruff.lint.isort]
# Keep the single `from iscc_lib._lowlevel import (X as X, ...)` re-export block intact —
# without this, isort explodes it into ~60 one-member import statements.
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests assert freely (S101) and shell out to git with trusted literal args
# (S603 untrusted-input, S607 partial-path) — both are noise in test helpers.
"tests/**" = ["S101", "S603", "S607"]

[dependency-groups]
dev = [
  "maturin",
  "prek",
  "ruff<0.16",                    # held: 3 findings left under 0.16 (RUF007 in scripts/gen_unicode16_unassigned.py, PLW1510 in scripts/test_install.py, EXE001 on tools/cid.py) — drop the pin once they are cleared
  "taplo",
  "yamlfix",
  "ty",
  "pytest",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-timeout",
  "mdformat",
  "mdformat-mkdocs[recommended]",
  "iscc-core",
  "zensical",
  "mkdocstrings[python]",
]
